# Publishes the site to GitHub Pages: landing/ is the front page, and the game
# (built from src/ with ./build.sh on every run, so it never depends on the
# committed dist/musliMineCraft.html being up to date) is musliMineCraft.html.
# Result: https://<owner>.github.io/<repo>/          the landing page
#         https://<owner>.github.io/<repo>/musliMineCraft.html   the game
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          ./build.sh
          mkdir -p public
          cp dist/musliMineCraft.html public/musliMineCraft.html
          mkdir -p public/assets
          cp -R landing/assets/. public/assets/
          cp landing/index.html public/index.html
          test -s public/index.html
          test -s public/musliMineCraft.html
          test -s public/assets/haram-plate.jpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: public

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The github-pages artifact did not become visible."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
