name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # the full suite takes 55-70 min on a shared runner, and a run cut off at the cap
    # prints no failure names, so leave room for the slower runners to finish the suite
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that dist/musliMineCraft.html is up to date
        run: |
          cp dist/musliMineCraft.html /tmp/committed.html
          ./build.sh
          if ! cmp -s dist/musliMineCraft.html /tmp/committed.html; then
            echo "::error::dist/musliMineCraft.html is out of date. Run ./build.sh and commit the result."
            exit 1
          fi

      - name: Install Python requirements
        run: pip install -r tests/e2e/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: tests/e2e
        env:
          SLOW: "1"
        shell: bash
        run: python -m pytest -q 2>&1 | tee pytest-output.txt

      # the log is only visible inside the run; surface the failing names as annotations
      - name: Name the failing tests
        if: failure()
        working-directory: tests/e2e
        shell: bash
        run: grep -E '^(FAILED|ERROR) ' pytest-output.txt | sed 's/^/::error::/' || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            tests/e2e/pytest-output.txt
            tests/e2e/test-results/
            tests/e2e/**/*.png
          if-no-files-found: ignore
